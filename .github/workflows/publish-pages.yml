# Free publishing route: gather feeds, build the static site and upload it to Cloudflare Pages
# (Direct Upload, which does not count towards the Pages build limit).
#
# Runs every 5 minutes (GitHub's minimum; busy periods can delay runs), on every push to main,
# and on demand from the breaking-news watcher in watcher/ (within a minute of major news).
# A new edition is only uploaded when the site design or something a reader would notice
# changed, or once an hour as a heartbeat.
# Use a public repository: Actions minutes are free and unlimited there.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN    token with "Account → Cloudflare Pages → Edit"
#   CLOUDFLARE_ACCOUNT_ID
# Repository variables (all optional):
#   SNAPSHOT_URL            build from a deployed gatherer Worker instead of gathering here
#   PAGES_PROJECT           defaults to sentinelglobalnews
#   SITE_URL                defaults to https://sentinelglobalnews.pages.dev
#   HEARTBEAT_MINUTES       republish an unchanged edition after this long (default 60)

name: Publish static site
run-name: ${{ inputs.reason || github.event_name }}

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if nothing changed
        type: boolean
        default: false
      reason:
        description: Why this run was requested (set by the breaking-news watcher)
        type: string
        default: Manual run

concurrency:
  group: publish-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}
      SITE_URL: ${{ vars.SITE_URL || 'https://sentinelglobalnews.pages.dev' }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'sentinelglobalnews' }}
      HEARTBEAT_MINUTES: ${{ vars.HEARTBEAT_MINUTES || '60' }}
      PUBLISH_INTERVAL_MINUTES: '5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keeps 7 days of regional score history between runs so trends work in gather-here mode.
      - name: Restore gatherer state
        if: env.SNAPSHOT_URL == ''
        uses: actions/cache@v4
        with:
          path: data/.local-kv.json
          key: sentinel-kv-${{ github.run_id }}
          restore-keys: sentinel-kv-

      - name: Gather feeds
        if: env.SNAPSHOT_URL == ''
        run: node worker/scripts/gather-local.mjs
        env:
          # Workers AI REST paraphrase (token needs Workers AI). Falls back to neutral templates if unset.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build static site
        run: node publisher/build.mjs
        env:
          # Advance the site badge only when this run was a push of site changes — not on
          # scheduled or watcher republishes of the same code with fresher news.
          BUMP_VERSION: ${{ github.event_name == 'push' && '1' || '0' }}

      - name: Check for changes
        id: check
        run: node publisher/scripts/should-deploy.mjs

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.check.outputs.deploy == 'true' || inputs.force
        run: npx --yes wrangler@4 pages deploy publisher/dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Keep package.json in step with the live badge after a versioned push.
      # [skip ci] avoids a publish loop on the bot commit.
      - name: Persist version bump
        if: steps.deploy.outcome == 'success' && github.event_name == 'push'
        run: |
          node publisher/scripts/sync-version.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --staged --quiet; then
            echo "package.json already up to date"
          else
            ver=$(node -p "require('./package.json').version")
            git commit -m "chore: bump version to ${ver} [skip ci]"
            git push
          fi
