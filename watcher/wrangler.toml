name = "sentinel-watcher"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Poll wire sources every minute. Routine publishes are requested every NUDGE_MINUTES.
[triggers]
crons = ["* * * * *"]

[vars]
GITHUB_REPO = "ConkieIron/sentinel"
GITHUB_WORKFLOW = "publish-pages.yml"
GITHUB_REF = "main"
# Published site; its /data/live.json lists the stories covered live.
SITE_URL = "https://sentinelglobalnews.pages.dev"
NUDGE_MINUTES = "5"
BREAKING_MIN_SEVERITY = "4"
# Every HEALTH_MINUTES the live edition's age is checked. Past STALE_MINUTES (longer than the
# publish workflow's 60-minute heartbeat) a rebuild is forced and an alert sent.
HEALTH_MINUTES = "5"
STALE_MINUTES = "90"

# Secrets (set with `npx wrangler secret put <NAME>`; for local dev use .dev.vars):
#   GITHUB_TOKEN   fine-grained token for the repo above with "Actions: Read and write" only
#   NTFY_TOPIC     private ntfy.sh topic that receives alerts (subscribe to it in the ntfy app)
#   ALERT_EMAIL    optional: also email alerts to this address (sent by ntfy.sh)
#
# Remembers which stories already triggered a publish. Created with:
#   npx wrangler kv namespace create WATCHER_KV
[[kv_namespaces]]
binding = "WATCHER_KV"
id = "220bcb6d3eb74eed919e255f55ec1a42"

[observability]
enabled = true
